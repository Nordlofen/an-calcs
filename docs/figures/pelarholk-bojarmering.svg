<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc">
<title id="title">Pelarholk – böjarmering i högra holkväggen</title>
<desc id="desc">Frilagd högra holkvägg med F1 åt höger på höjden a1 lika med 0,9l över pelarfoten. I snittet verkar V lika med F1 åt vänster, Fs nedåt i dragarmeringen och Fc uppåt i betongtryckresultanten. Den inre hävarmen är z lika med 0,9d. En separat detalj visar bh, tig, täckskikt, stångdiameter, d och z.</desc>
