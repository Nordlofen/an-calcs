[project]
name = "an-calcs"
version = "0.1.0"
description = "Calculation helpers for AN Suite."
readme = "README.md"
requires-python = ">=3.13"

[project.optional-dependencies]
notebook = ["anywidget>=0.9,<1", "Pillow>=11", "pypdfium2>=4.30,<6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/an_calcs"]
